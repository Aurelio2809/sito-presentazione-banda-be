name: Deploy Backend to VPS

on:
  push:
    branches:
      - integrazione
    paths-ignore:
      - "ops/**"
      - "**/*.md"
  pull_request:
    branches:
      - integrazione
    paths-ignore:
      - "ops/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Format, test and package BE
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Format, test and package
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check verify

  deploy:
    name: Deploy BE
    runs-on: self-hosted
    needs: quality
    if: github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Deploy through restricted host command
        run: sudo -n /usr/local/sbin/deploy-sito-banda-backend
