spring.application.name=sito-presentazione-banda-be-new

# Profilo di default quando lanci da IntelliJ/terminale
spring.profiles.default=local

# OpenAPI / Swagger (opzionale ma comodo)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Storage
app.storage.upload-dir=./uploads
app.storage.photos-dir=photos
app.storage.max-file-size=50MB
app.storage.allowed-extensions=jpg,jpeg,png,gif,webp
# Qualita' JPEG thumbnail: 0.82 e' lo standard web moderno (visivamente
# quasi-lossless a schermo) e riduce drasticamente il peso vs 1.0 (che
# produceva thumbnail piu' pesanti della foto originale, es. 488KB vs 281KB).
app.storage.thumbnail-jpeg-quality=0.82
app.storage.thumbnail-png-quality=0.90

# Servlet Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Sicurezza Cookie (CSRF mitigations) e Proxy Caddy
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict