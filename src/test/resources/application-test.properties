spring.datasource.url=jdbc:h2:mem:banda-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.storage.upload-dir=${java.io.tmpdir}/sito-banda-tests
app.storage.photos-dir=photos
app.storage.allowed-extensions=jpg,jpeg,png,gif,webp

server.servlet.session.cookie.secure=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
