services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.hardened
    image: silaware/n8n:2.31.6-hardened
    container_name: n8n
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - N8N_HOST=n8n.silaware.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.silaware.com/
      - GENERIC_TIMEZONE=Europe/Rome
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - proxy_n8n

networks:
  proxy_n8n:
    external: true

volumes:
  n8n_data:
